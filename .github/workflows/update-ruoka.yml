name: Päivitä ruokalista

on:
  schedule:
    - cron: "0 3 * * 1"   # maanantaisin klo 06 Suomen aikaa
  workflow_dispatch:       # nappi manuaaliseen ajoon

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generoi ruoka.ics
        run: python ruoka_ics.py

      - name: Commitoi jos muuttui
        run: |
          git config user.name "ruoka-bot"
          git config user.email "actions@github.com"
          git add ruoka.ics
          git diff --staged --quiet || git commit -m "Päivitä ruokalista $(date -u +%F)"
          git push
